version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leafscan-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: leafscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leafscan-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leafscan-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - agrogaurd-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  agrogaurd-network:
    driver: bridge
